<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MotionPaste — same motion, two designs</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #101015;
        color: #f2effa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 1280px;
        margin: 70px auto 0;
      }
      .eyebrow {
        color: #b9adff;
        font-size: 16px;
        letter-spacing: 3px;
        font-weight: 700;
      }
      h1 {
        font-size: 76px;
        line-height: 1.1;
        letter-spacing: -3px;
        margin: 24px 0 18px;
      }
      .intro {
        font-size: 23px;
        color: #b7b1c7;
        margin: 0 0 40px;
      }
      .designs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
      }
      .panel {
        height: 410px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .panel:first-child {
        background: #e4dfd6;
      }
      .panel:last-child {
        background: #25203a;
      }
      .label {
        position: absolute;
        top: 22px;
        left: 26px;
        font-size: 12px;
        letter-spacing: 2px;
        color: #726d75;
        font-weight: 700;
      }
      .panel:last-child .label {
        color: #b4a7d6;
      }
      #card {
        width: 260px;
        height: 245px;
        background: #fbf9f4;
        color: #353d35;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 15px 45px #3837301f;
      }
      #card .symbol {
        font-size: 36px;
        color: #628f57;
      }
      #card h2 {
        font-size: 31px;
        line-height: 1.1;
        margin: 18px 0;
        letter-spacing: -1px;
      }
      #card p {
        color: #778071;
        font-size: 11px;
        letter-spacing: 1.7px;
      }
      #button {
        border: none;
        background: #c0b1ff;
        color: #24183f;
        border-radius: 100px;
        padding: 27px 38px;
        font-family: inherit;
        font-size: 25px;
        font-weight: 700;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 35px;
        color: #a39bb5;
        font-size: 17px;
      }
      #replay {
        color: #f2effa;
        background: #26232f;
        border: 1px solid #51495e;
        border-radius: 10px;
        padding: 15px 24px;
        font: inherit;
        cursor: pointer;
      }
      #replay:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #replay:focus-visible {
        outline: 2px solid #b9adff;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">MOTIONPASTE / INDEPENDENT CONSUMER</p>
      <h1>One motion. Two designs.</h1>
      <p class="intro">
        The same exported JavaScript, applied to a card and a button.
      </p>
      <section class="designs" aria-label="Independent target designs">
        <div class="panel">
          <span class="label">A QUIET LITTLE CARD</span>
          <article id="card">
            <span class="symbol">✳</span>
            <h2>Make room<br />for good things.</h2>
            <p>COLLECTION / 024</p>
          </article>
        </div>
        <div class="panel">
          <span class="label">A BOLD CALL TO ACTION</span
          ><button id="button">Make it yours ↗</button>
        </div>
      </section>
      <footer>
        <span id="status">Waiting for the actual Studio download.</span
        ><button id="replay" disabled>Replay both ↻</button>
      </footer>
    </main>
  </body>
</html>
